<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The Cloudflare Turnstile check shown before sign-in, sign-up and
       password reset (lib/features/auth/presentation/captcha). Its own policy:
       only this site's script and Cloudflare's checker may run here. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://challenges.cloudflare.com;
    frame-src https://challenges.cloudflare.com;
    connect-src https://challenges.cloudflare.com;
    style-src 'unsafe-inline';
    base-uri 'none';
    form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>SmartBudget check</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="check"></div>
  <script src="turnstile.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=sbTurnstileReady&amp;render=explicit" async defer></script>
</body>
</html>
