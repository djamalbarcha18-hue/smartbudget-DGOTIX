<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google's own «Continue with Google» button on the sign-in and sign-up
       pages (lib/features/auth/presentation/widgets/google_button_view_web.dart).
       Google comes back to this site with an ID token, which the app hands to
       Supabase. Its own policy: only this site's script and Google's sign-in
       may run here. (No referrer meta: Google's button needs the origin.) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://accounts.google.com/gsi/client;
    frame-src https://accounts.google.com/gsi/;
    connect-src https://accounts.google.com/gsi/;
    style-src 'unsafe-inline' https://accounts.google.com/gsi/style;
    base-uri 'none';
    form-action 'none'">
  <title>SmartBudget Google sign-in</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="button"></div>
  <script src="google_signin.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
