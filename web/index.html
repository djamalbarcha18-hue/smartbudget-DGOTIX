<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartBudget — by DGOTIX. Premium financial SaaS.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartBudget">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>SmartBudget — by DGOTIX</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Prevent white flash before Flutter paints (dark-first premium experience). */
    html, body { margin: 0; padding: 0; height: 100%; background-color: #0B1120; }
  </style>
</head>
<body>
  <script>
    // Keep the browser's install prompt so the app can offer "Install" at a
    // good moment (it fires once, often before Flutter has started).
    window.sbInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.sbInstallPrompt = e;
      window.dispatchEvent(new Event('sbinstallchange'));
    });
    window.addEventListener('appinstalled', function () {
      window.sbInstallPrompt = null;
      window.sbInstalled = true;
      window.dispatchEvent(new Event('sbinstallchange'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
