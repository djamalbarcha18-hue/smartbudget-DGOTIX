<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Content Security Policy: the page may load code only from itself and
       Flutter's CDN, and talk only to the services the app uses (Supabase,
       Google Fonts, the exchange-rate, gold and parallel-market sources).
       Injected code could not send data anywhere else. A service missing
       here is blocked: add any new one the app calls. blob: lets the app
       read a photo the user picked (receipt scanner); it never leaves the
       browser. test/web_csp_test.dart checks this list. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' blob: https://fconhnyognxcpvmwobus.supabase.co https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://open.er-api.com https://dolarapi.com https://api.gold-api.com https://api.coingecko.com https://squarealgerie.com;
    worker-src 'self' blob:;
    manifest-src 'self';
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartBudget — by DGOTIX. Premium financial SaaS.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartBudget">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>SmartBudget — by DGOTIX</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Prevent white flash before Flutter paints (dark-first premium experience). */
    html, body { margin: 0; padding: 0; height: 100%; background-color: #0B1120; }
  </style>
</head>
<body>
  <script src="install_prompt.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
