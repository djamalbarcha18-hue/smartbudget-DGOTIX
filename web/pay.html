<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Paddle's secure checkout for a subscription the server prepared
       (supabase/functions/create-checkout). Paddle.js opens it by itself from
       the _ptxn transaction id in the address. Its own policy: only this
       site's script and Paddle may run here. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://cdn.paddle.com;
    frame-src https://*.paddle.com;
    connect-src https://*.paddle.com;
    img-src 'self' data: https://*.paddle.com;
    style-src 'unsafe-inline' https://*.paddle.com;
    font-src https://*.paddle.com;
    base-uri 'none';
    form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>SmartBudget</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; color: #e5e7eb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; box-sizing: border-box; }
    main { max-width: 360px; }
    p { margin: 12px 0; line-height: 1.6; }
    a { color: #34d399; }
    .spin { width: 32px; height: 32px; margin: 0 auto; border-radius: 50%;
      border: 3px solid #1f2937; border-top-color: #34d399;
      animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spin" id="spin"></div>
    <p id="status">جارٍ فتح صفحة الدفع الآمنة…<br>Opening the secure checkout…<br>Ouverture du paiement sécurisé…<br>Abriendo el pago seguro…</p>
    <p><a id="back" href="./#/plans">العودة إلى SmartBudget · Back to SmartBudget · Retour à SmartBudget · Volver a SmartBudget</a></p>
  </main>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="pay.js"></script>
</body>
</html>
