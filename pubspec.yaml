name: smartbudget
description: "SmartBudget — by DGOTIX. Premium financial SaaS (Flutter Web-first)."
publish_to: "none"
version: 1.0.0+1

environment:
  # Dart 3.6 / Flutter 3.27 floor: uses the Color.withValues() API and the
  # current Material 3 / WidgetState* names.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (chosen for testability + granular rebuilds — see docs/ARCHITECTURE.md)
  flutter_riverpod: ^2.5.1

  # Routing (web URLs, deep links, guards)
  go_router: ^14.2.0

  # Internationalization. Kept on the 0.20.x line to match the version that the
  # bundled flutter_localizations depends on (the SDK pins intl within 0.20.x);
  # ^0.20.0 accepts whatever patch that is, avoiding resolution conflicts.
  intl: ^0.20.0

  # Brand SVG logos (theme-aware, vector)
  flutter_svg: ^2.0.10

  # Typography (Tajawal for Arabic, Inter for Latin)
  google_fonts: ^6.2.1

  # Per-viewer preferences (theme + locale) — NOT financial data
  shared_preferences: ^2.2.3

  # Opens external links (e.g. the provider's console to grab a personal AI
  # key). On web this opens a new browser tab.
  url_launcher: ^6.3.0

  # HTTP client for the live markets data layer (keyless public APIs only;
  # NO secrets in the frontend). Works on Flutter web via the Fetch API.
  http: ^1.2.2

  # Production backend (auth + Postgres). Dormant unless SUPABASE_URL/ANON_KEY
  # are provided at build time; the app falls back to the local dev backend
  # otherwise, so the free web demo keeps working with zero credentials.
  supabase_flutter: ^2.5.6

  # Camera / gallery capture for the Receipt Scanner (works on web + mobile).
  # The captured bytes are sent to the receipt-scan Edge Function (Gemini).
  image_picker: ^1.1.2

  # Branded PDF export for reports (pure-Dart document builder + cross-platform
  # print/save, incl. web). printing also supplies Arabic-capable Google fonts.
  pdf: ^3.11.1
  printing: ^5.13.3

  # Hashing the app-lock PIN (salted, iterated SHA-256) — never stored in clear.
  crypto: ^3.0.3

  # QR code generation for "Share SmartBudget" (pure Dart, outputs SVG). Already
  # pulled in by `pdf`; declared here because the app uses it directly.
  barcode: ^2.2.8

  # Mobile (Android/iOS) versions of the web-only features: the system share
  # sheet, fingerprint/face unlock, and saving/opening backup files.
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Android launcher icons from assets/launcher/ (run
  # `dart run flutter_launcher_icons` after changing them).
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher/icon_full.png"
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  min_sdk_android: 28

flutter:
  uses-material-design: true

  # Generate localized messages from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  assets:
    - assets/brand/
    - assets/flags/
    # Bundled Arabic font for offline PDF export (Tajawal, OFL — matches the
    # app's Arabic typography). See docs/THIRD_PARTY_LICENSES.md.
    - assets/fonts/
