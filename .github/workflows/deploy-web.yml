name: Deploy Web Preview

# Builds the Flutter web app and publishes it to GitHub Pages so every push to
# the default branch produces a live, shareable URL — no local Flutter/Git/
# emulator needed.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Permissions required by the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Served at https://smartbudget.dgotix.com/ (custom domain). The base is
      # made relative ("./") so the same bundle also works at the old
      # github.io/smartbudget-DGOTIX/ address (routes are hash-based, so the
      # page itself never moves).
      - name: Build web (release)
        run: |
          flutter build web --release --base-href /
          sed -i 's#<base href="/">#<base href="./">#' build/web/index.html
          grep -q '<base href="./">' build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
