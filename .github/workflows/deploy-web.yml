name: Deploy Web Preview

# Builds the Flutter web app and publishes it to GitHub Pages so every push to
# the default branch produces a live, shareable URL — no local Flutter/Git/
# emulator needed.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Permissions required by the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned, so pubspec.lock (enforced below) and builds are reproducible.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Served at https://smartbudget.dgotix.com/ (custom domain). The base is
      # made relative ("./") so the same bundle also works at the old
      # github.io/smartbudget-DGOTIX/ address (routes are hash-based, so the
      # page itself never moves).
      # Online features (sign-in, cloud backup, AI) turn on only when both
      # repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are set (the anon
      # key is public by design; never add the service_role key here).
      - name: Build web (release)
        env:
          # The project's URL and publishable key are public by design (they
          # ship inside the app); repository secrets of the same name override
          # them. Never put the secret / service_role key here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fconhnyognxcpvmwobus.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5xtM1xBGuJJldtP_87Tzpg_XDB3Euff' }}
          # Cloudflare Turnstile site key (public by design, like the
          # publishable key): turns on the human check before sign-in,
          # sign-up and password reset. A repository secret of the same name
          # overrides it. Never put the Turnstile SECRET key here: it belongs
          # in Supabase (Authentication > Attack Protection) only.
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || '0x4AAAAAAFQb5tnXUE643C_f' }}
        run: |
          DEFINES=""
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            DEFINES="$DEFINES --dart-define=TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY"
          fi
          # Each deploy gets an id (see tool/finish_web_build.sh: update
          # check, cache-busted scripts, offline copy). The engine (canvaskit)
          # is served by the site itself, not Google's CDN, so the offline
          # copy (web/sw.js) can keep it.
          BUILD_ID="${GITHUB_SHA::12}"
          flutter build web --release --no-web-resources-cdn --base-href / $DEFINES --dart-define=BUILD_ID=$BUILD_ID
          tool/finish_web_build.sh "$BUILD_ID"
          # The page's Content-Security-Policy (web/index.html) must allow the
          # Supabase project, or sign-in and sync would be blocked.
          if [ -n "$SUPABASE_URL" ] && ! grep -q "connect-src[^;]*${SUPABASE_URL%/}" build/web/index.html; then
            echo "web/index.html: add $SUPABASE_URL to connect-src"; exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
