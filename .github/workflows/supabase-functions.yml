name: Deploy Supabase functions

# Deploys every Edge Function in supabase/functions to the SmartBudget
# Supabase project whenever one of them changes on main (or by hand: Actions >
# Deploy Supabase functions > Run workflow).
#
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from
#                          https://supabase.com/dashboard/account/tokens
# Provider keys (GEMINI_API_KEY, ...) are NOT stored here: set them in the
# Supabase dashboard (Edge Functions > Secrets).
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: fconhnyognxcpvmwobus

# Read-only: these jobs only check out the code; deploying uses secrets,
# not the GitHub token.
permissions:
  contents: read

jobs:
  # The functions' security scenarios (webhooks, checkout, limits, account
  # deletion) must pass before anything is deployed.
  test:
    name: Test Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Function scenarios
        run: deno run -A --import-map supabase/tests/import_map.json supabase/tests/functions_test.ts

  deploy:
    name: Deploy Edge Functions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN secret: functions not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.token.outputs.ok == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Browsers may call the functions only from the app's site (the
          # Android app is not a browser, so this doesn't limit it).
          supabase secrets set --project-ref "$PROJECT_REF" \
            ALLOWED_ORIGIN=https://smartbudget.dgotix.com
          supabase functions deploy --project-ref "$PROJECT_REF"
          # Functions of a removed provider (Paddle → Whop) stop answering.
          for retired in paddle-webhook; do
            supabase functions delete "$retired" --project-ref "$PROJECT_REF" || true
          done
          supabase functions list --project-ref "$PROJECT_REF"
