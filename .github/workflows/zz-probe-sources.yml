name: Probe price sources (temporary)
on:
  push:
    branches: ["tmp/share-sms"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          get() { echo; echo "===== $1"; curl -sS -g -m 40 -L -H "Accept: ${2:-application/json}" -w "\nHTTP %{http_code} %{content_type}\n" "$1" | head -c "${3:-1500}"; echo; }
          get "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+/M.W00.PWHEAMT.USD?lastNObservations=2" "application/vnd.sdmx.data+json;version=2.0.0" 2500
          get "https://api.imf.org/external/sdmx/2.1/data/IMF.RES,PCPS/M.W00.PWHEAMT.USD?lastNObservations=2" "application/vnd.sdmx.data+json;version=1.0.0" 2500
          get "https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.RES/PCPS/+/W00.PWHEAMT.USD.M?lastNObservations=2" "application/json" 1500
          get "https://api.imf.org/external/sdmx/3.0/structure/dataflow/IMF.RES/PCPS/+" "application/json" 2500
          echo "== worldbank page links"
          curl -sS -L -m 40 "https://www.worldbank.org/en/research/commodity-markets" | grep -oiE 'https?://[^"'"'"' ]+\.xlsx' | sort -u | head -20
          curl -sS -L -m 40 "https://www.worldbank.org/en/research/commodity-markets" | grep -oiE 'href="[^"]*(pink|CMO)[^"]*"' | sort -u | head -20
