name: Probe price sources (temporary)
on:
  push:
    branches: ["tmp/share-sms"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          B=https://api.db.nomics.world/v22
          echo "== provider"; curl -sS "$B/providers/IMF" | jq -c '.provider | del(.category_tree)' | head -c 1500; echo
          echo "== dataset meta (no labels)"; curl -sS "$B/datasets/IMF/PCPS" | jq -c '.datasets.docs[0] | del(.dimensions_values_labels, .attributes_values_labels, .dimensions_labels, .attributes_labels)' | head -c 1500; echo
          echo "== commodity labels"; curl -sS "$B/datasets/IMF/PCPS" | jq -r '.datasets.docs[0].dimensions_values_labels.COMMODITY | to_entries[] | "\(.key)\t\(.value)"'
          IDS="IMF/PCPS/M.W00.PWHEAMT.USD,IMF/PCPS/M.W00.PMAIZMT.USD,IMF/PCPS/M.W00.PRICENPQ.USD,IMF/PCPS/M.W00.PSOYB.USD,IMF/PCPS/M.W00.PSUGAISA.USD,IMF/PCPS/M.W00.PCOFFOTM.USD,IMF/PCPS/M.W00.PCOCO.USD,IMF/PCPS/M.W00.PPOIL.USD,IMF/PCPS/M.W00.PIORECR.USD,IMF/PCPS/M.W00.PCOPP.USD,IMF/PCPS/M.W00.PALUM.USD,IMF/PCPS/M.W00.PZINC.USD,IMF/PCPS/M.W00.PNICK.USD,IMF/PCPS/M.W00.PLEAD.USD,IMF/PCPS/M.W00.PTIN.USD,IMF/PCPS/M.W00.PCOBA.USD,IMF/PCPS/M.W00.POILBRE.USD,IMF/PCPS/M.W00.POILWTI.USD,IMF/PCPS/M.W00.PNGASUS.USD"
          echo "== multi"; curl -sS -G "$B/series" --data-urlencode "series_ids=$IDS" --data-urlencode "observations=1" --data-urlencode "metadata=false" > multi.json
          jq -c '._meta, (.series.num_found), (.series.docs | length)' multi.json
          jq -r '.series.docs[] | [.series_code, .series_name, (.period[-2:]|tostring), (.value[-2:]|tostring), (.period_start_day[-1:]|tostring), ((keys)|tostring)] | @tsv' multi.json
          echo "== one doc keys/extra"; jq -c '.series.docs[0] | del(.period, .value, .period_start_day)' multi.json | head -c 1500; echo
          echo "== NA check"; jq -c '[.series.docs[] | .value | map(select(type=="string")) | .[:3]]' multi.json | head -c 400; echo
          echo "== size"; wc -c multi.json
          echo "== eia"; curl -sS -g -w "\nHTTP %{http_code}\n" "https://api.eia.gov/v2/petroleum/pri/spt/data/?frequency=daily&data[0]=value&facets[series][]=RBRTE&length=2" | head -c 800; echo
          curl -sS -g -w "\nHTTP %{http_code}\n" "https://api.eia.gov/v2/petroleum/pri/spt/?api_key=x" | head -c 600; echo
