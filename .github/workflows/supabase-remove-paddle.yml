name: Remove Paddle from Supabase

# One-off cleanup after the move from Paddle to Whop (docs/BILLING.md), run
# when this file changes or by hand. Safe to run again: each step only acts on
# what is still there, then checks it is gone.
#   1. deletes the paddle-webhook Edge Function;
#   2. deletes every PADDLE_* secret;
#   3. applies billing.sql and subscription_lifecycle.sql (provider 'whop'
#      instead of 'paddle', Paddle prices retired) in one transaction.
# Uses the Supabase Management API with SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/supabase-remove-paddle.yml"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: fconhnyognxcpvmwobus
  API: https://api.supabase.com/v1/projects/fconhnyognxcpvmwobus

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove Paddle
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::No SUPABASE_ACCESS_TOKEN secret."
            exit 1
          fi

      - name: Delete the paddle-webhook function
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          slugs=$(curl -sS --fail-with-body "${auth[@]}" "$API/functions" | jq -r '.[].slug')
          echo "Functions: $(echo $slugs)"
          if echo "$slugs" | grep -qx paddle-webhook; then
            curl -sS --fail-with-body -X DELETE "${auth[@]}" "$API/functions/paddle-webhook"
            echo "Deleted paddle-webhook."
          else
            echo "paddle-webhook is already gone."
          fi

      - name: Delete the PADDLE_* secrets
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          names=$(curl -sS --fail-with-body "${auth[@]}" "$API/secrets" \
            | jq -c '[.[].name | select(startswith("PADDLE_"))]')
          echo "Paddle secrets found: $names"
          if [ "$names" != "[]" ]; then
            curl -sS --fail-with-body -X DELETE "${auth[@]}" \
              -H "Content-Type: application/json" -d "$names" "$API/secrets"
            echo "Deleted."
          fi

      - name: Apply the billing SQL (whop instead of paddle)
        run: |
          set -euo pipefail
          sql=$( { echo "begin;"; cat supabase/billing.sql supabase/subscription_lifecycle.sql; echo "commit;"; } \
            | jq -Rs '{query: .}')
          mkdir -p out
          code=$(curl -sS -o out/sql-response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d "$sql" "$API/database/query")
          echo "HTTP $code" | tee out/sql-status.txt
          [ "${code:0:1}" = "2" ] || { echo "::error::The SQL was refused (see the sql-response artifact)."; exit 1; }
          echo "Applied."

      # Supabase's answer to the SQL (status and error text, no secrets), for
      # reading why it failed.
      - name: Keep the SQL response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-response
          path: out/
          if-no-files-found: ignore
          retention-days: 3

      - name: "Check: no Paddle function or secret is left"
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if curl -sS --fail-with-body "${auth[@]}" "$API/functions" | jq -e '.[] | select(.slug == "paddle-webhook")' >/dev/null; then
            echo "::error::paddle-webhook is still deployed."; exit 1
          fi
          if curl -sS --fail-with-body "${auth[@]}" "$API/secrets" | jq -e '.[] | select(.name | startswith("PADDLE_"))' >/dev/null; then
            echo "::error::A PADDLE_ secret is still set."; exit 1
          fi
          echo "No Paddle function or secret left."

      - name: "Check: the database accepts Whop and sells nothing on Paddle"
        run: |
          set -euo pipefail
          q='select (pg_get_functiondef('"'"'public.apply_subscription_event'"'"'::regproc) like '"'"'%whop%'"'"')::text as whop_ok, (select count(*) from billing_prices where provider = '"'"'paddle'"'"' and active)::text as paddle_active'
          out=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d "$(jq -n --arg q "$q" '{query: $q}')" "$API/database/query")
          echo "$out"
          echo "$out" | jq -e '.[0].whop_ok == "true" and .[0].paddle_active == "0"' >/dev/null \
            || { echo "::error::The database still expects Paddle."; exit 1; }
