name: Android build

# Builds the Google Play version of SmartBudget (STORE_BUILD: no outside
# payment, no developer tools):
#   - app-release.aab  -> upload to Google Play Console
#   - app-release.apk  -> install directly on a phone to test
# Both are attached to the run as the "smartbudget-android" artifact.
#
# Signing: add these repository secrets (Settings > Secrets and variables >
# Actions). Without them the build is signed with a debug key: fine to install
# for testing, but Google Play will not accept it.
#   ANDROID_KEYSTORE_BASE64   the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional (online features), same as the web build:
#   SUPABASE_URL, SUPABASE_ANON_KEY
on:
  # Only after the tests pass on main: a red build is never published.
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

# Read-only: these jobs only check out the code; deploying uses secrets,
# not the GitHub token.
permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (Google Play)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit the tests passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned, so pubspec.lock (enforced below) and builds are reproducible.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # No release key: the APKs are debug-signed and named so, and no
            # app bundle is made, so a test build can never pass for the store
            # build (security audit F-14).
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: DEBUG-SIGNED test build only (no app bundle; not for Google Play)."
            echo "### ⚠️ DEBUG-SIGNED test build" >> "$GITHUB_STEP_SUMMARY"
            echo "No release signing key in this repository: the APKs are signed with a debug key, for testing only. No app bundle (.aab) was built." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle and APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          # The project's URL and publishable key are public by design (they
          # ship inside the app); repository secrets of the same name override
          # them. Never put the secret / service_role key here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fconhnyognxcpvmwobus.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_5xtM1xBGuJJldtP_87Tzpg_XDB3Euff' }}
          # Cloudflare Turnstile site key (public by design, like the
          # publishable key): turns on the human check before sign-in,
          # sign-up and password reset. A repository secret of the same name
          # overrides it. Never put the Turnstile SECRET key here: it belongs
          # in Supabase (Authentication > Attack Protection) only.
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || '0x4AAAAAAFQb5tnXUE643C_f' }}
        run: |
          # The device database for the user's lists (docs/LOCAL_DATABASE.md).
          # Google Play refuses a version code it has seen: each build gets a
          # higher one (pubspec.yaml stays at +1). 1000+ keeps it above any
          # bundle uploaded by hand before.
          DEFINES="--build-number=$((1000 + ${{ github.run_number }})) --dart-define=STORE_BUILD=true --dart-define=INDEXED_DB=true --dart-define=ERROR_REPORTS=true"
          # After the beta: the free plan's limits apply and the account's plan
          # comes from the server, so Pro bought on the website works here. The
          # store app itself never sells or links to a payment
          # (AppEnv.storeFreeMode, docs/PLAY_STORE.md).
          DEFINES="$DEFINES --dart-define=BETA_ALL_ACCESS=false"
          # No «Continue with Google» in the app for now: the website signs in
          # with Google's own button, which needs no Supabase address at
          # Google; the app's version (Google's native sign-in) comes with the
          # Play Store build (docs/GOOGLE_SIGN_IN.md). E-mail sign-in stays.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            # Commodity prices (industrial metals, steel & iron, energy,
            # agriculture) come through the project's market-proxy function.
            DEFINES="$DEFINES --dart-define=MARKET_API_URL=${SUPABASE_URL%/}/functions/v1/market-proxy"
          fi
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            DEFINES="$DEFINES --dart-define=TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY"
          fi
          # The store bundle only with the release key.
          if [ "$SIGNED" = "true" ]; then
            flutter build appbundle --release $DEFINES
          fi
          flutter build apk --release $DEFINES
          # A small APK for today's phones (64-bit ARM), to test on a phone.
          flutter build apk --release --split-per-abi --target-platform android-arm64 $DEFINES
          if [ "$SIGNED" = "true" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk SmartBudget-phone.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk app-release-DEBUG-SIGNED.apk
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk SmartBudget-phone-DEBUG-SIGNED.apk
          fi

      - name: Upload
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smartbudget-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload phone APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SmartBudget-phone-apk
          path: SmartBudget-phone.apk
          if-no-files-found: error

      # Without the release key: only the debug-signed test APKs, named so.
      - name: Upload test APKs (DEBUG-SIGNED)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smartbudget-android-DEBUG-SIGNED
          path: |
            app-release-DEBUG-SIGNED.apk
            SmartBudget-phone-DEBUG-SIGNED.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
