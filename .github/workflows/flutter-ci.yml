name: Flutter CI

# Validates the SmartBudget SaaS app (Flutter Web-first). The Flutter project
# lives at the repository root in this dedicated repo.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies (also runs gen-l10n)
        run: flutter pub get

      - name: Static analysis
        # Fail on warnings/errors (real problems). Info-level style hints (e.g.
        # prefer_const_constructors) are reported but non-fatal while there is
        # no local Flutter toolchain to preflight them; tighten later.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
